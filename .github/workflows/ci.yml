name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, test]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: matrix.job == 'fmt'
        run: cargo fmt --all -- --check
      - name: clippy
        if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        if: matrix.job == 'test'
        run: cargo test --workspace

  php:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {laravel: 11, php: '8.2', testbench: '^9.0'}
          - {laravel: 12, php: '8.2', testbench: '^10.0'}
          - {laravel: 12, php: '8.4', testbench: '^10.0'}
          - {laravel: 13, php: '8.3', testbench: '^11.0'}
          - {laravel: 13, php: '8.4', testbench: '^11.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: 'highest'
      - name: Pin Laravel and Testbench
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update "illuminate/console:*" "illuminate/contracts:*" "illuminate/support:*" "orchestra/testbench:*" --with-all-dependencies --prefer-dist --no-interaction
      - name: Laravel Pint
        run: vendor/bin/pint --test
      - name: PHPUnit
        run: vendor/bin/phpunit
